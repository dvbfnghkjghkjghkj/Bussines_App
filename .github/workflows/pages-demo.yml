name: Demo (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/pages-demo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Демо-сборка
        run: npm run build:demo

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
