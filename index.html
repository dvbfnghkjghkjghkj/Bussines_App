<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Запись в барбершоп: услуги, цены, адрес и заявка в Telegram" />
    <title>Загрузка…</title>
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top">
        <img id="logo" class="brand__logo" src="./logo.svg" alt="" width="40" height="40" />
        <span class="brand__text">
          <strong id="company-name">Компания</strong>
          <span id="company-tagline" class="brand__tagline"></span>
        </span>
      </a>
      <a id="header-phone" class="topbar__phone" href="tel:+70000000000">+7 000 000-00-00</a>
    </header>

    <main id="top">
      <section class="hero">
        <p class="hero__eyebrow" id="hero-eyebrow"></p>
        <h1 class="hero__title" id="hero-title">Барбершоп</h1>
        <p class="hero__lead" id="hero-lead"></p>
        <p class="hero__hours" id="hero-hours"></p>
        <div class="hero__actions">
          <a class="button button--primary" href="#request">Записаться</a>
          <a class="button button--ghost" id="hero-telegram" href="#request" hidden>Написать в Telegram</a>
        </div>
        <aside class="promo" id="promo" hidden>
          <strong class="promo__title" id="promo-title"></strong>
          <span class="promo__text" id="promo-text"></span>
        </aside>
      </section>

      <section class="section" aria-labelledby="services-title">
        <div class="section__head">
          <h2 id="services-title">Услуги и цены</h2>
          <p class="section__hint">
            Цена зависит от уровня мастера. Точную стоимость подтвердим при записи.
          </p>
        </div>
        <div id="services" class="cards"></div>
      </section>

      <section class="section" aria-labelledby="find-title">
        <div class="section__head">
          <h2 id="find-title">Как найти</h2>
        </div>
        <ul id="find" class="zones"></ul>
      </section>

      <section class="section section--form" id="request" aria-labelledby="request-title">
        <div class="section__head">
          <h2 id="request-title">Запись</h2>
          <p class="section__hint">Оставьте контакты — подтвердим время в рабочее время барбершопа.</p>
        </div>

        <form id="request-form" class="form" novalidate>
          <div class="field">
            <label for="field-name">Имя</label>
            <input id="field-name" name="name" type="text" autocomplete="name" placeholder="Как к вам обращаться" required />
          </div>
          <div class="field">
            <label for="field-phone">Телефон</label>
            <input id="field-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+7 ___ ___-__-__" required />
          </div>
          <div class="field">
            <label for="field-service">Услуга</label>
            <select id="field-service" name="service"></select>
          </div>
          <div class="field">
            <label for="field-level">Мастер</label>
            <select id="field-level" name="level"></select>
          </div>
          <div class="field">
            <label for="field-when">Дата и время</label>
            <input id="field-when" name="when" type="datetime-local" />
          </div>
          <div class="field field--wide">
            <label for="field-comment">Комментарий</label>
            <textarea id="field-comment" name="comment" rows="3" placeholder="Пожелания, день рождения, детали"></textarea>
          </div>

          <p id="price-preview" class="price-preview" aria-live="polite"></p>
          <p id="form-error" class="form__error" role="alert" hidden></p>

          <div class="form__actions">
            <button class="button button--primary" type="submit">Отправить в Telegram</button>
            <button class="button button--ghost" id="copy-request" type="button" hidden>
              Скопировать заявку
            </button>
          </div>
          <p class="form__note" id="form-note"></p>
        </form>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__col">
        <strong id="footer-name">Компания</strong>
        <span id="footer-address"></span>
      </div>
      <div class="footer__col">
        <span id="footer-hours"></span>
        <a id="footer-phone" href="tel:+70000000000">+7 000 000-00-00</a>
        <a id="footer-map" href="#" target="_blank" rel="noopener">Яндекс Карты</a>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
